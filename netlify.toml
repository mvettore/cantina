[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."scan-label"]
  timeout = 26

[functions."enrich-wine"]
  timeout = 26

[functions."search-wine-url"]
  timeout = 26

[functions."fuel-prices"]
  timeout = 26

[[redirects]]
  from = "/benzina"
  to = "/benzina.html"
  status = 200

[[redirects]]
  from = "/benzina/*"
  to = "/benzina.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
